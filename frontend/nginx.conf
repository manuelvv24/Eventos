server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para assets estáticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    # No exponer versión de nginx
    server_tokens off;

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy de la API hacia el backend (mismo host cuando se despliega con
    # docker-compose). En despliegues de servicios separados (p. ej. Railway)
    # define VITE_API_URL absoluta en tiempo de build y este bloque no se usa.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache largo solo para assets con hash en el nombre (generados por Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # favicon e imágenes sin hash: caché corta
    location = /favicon.svg {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /favicon.png {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html SIEMPRE revalidado: evita pantallas en blanco tras un deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA: todas las rutas del cliente se redirigen a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
