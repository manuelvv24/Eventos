spring.application.name=eventos

# ── Base de datos PostgreSQL ──────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:EVENTOS}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Certificados PDF ──────────────────────────────────────────────────────────
certificados.directorio-salida=${CERTIFICADOS_DIR:uploads/certificados}
certificados.organizacion=${CERTIFICADOS_ORG:Gestion de Eventos S.A.}
certificados.url-verificacion=${CERTIFICADOS_URL_VERIFICACION:http://localhost:5173/verificar/codigo?codigo=}

# ── Thymeleaf (solo para generacion de PDF, no como MVC view resolver) ────────
spring.thymeleaf.check-template-location=false

# ── Upload de archivos (importacion CSV / Excel) ───────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.Eventos.eventos=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.deprecation=ERROR
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=ERROR

# ── Puerto del servidor ───────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── Cloudinary ────────────────────────────────────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ── Check-in: ventana temporal ────────────────────────────────────────────────
checkin.margen-antes-min=${CHECKIN_MARGEN_ANTES:60}
checkin.porcentaje-cierre=${CHECKIN_PORCENTAJE_CIERRE:50}

# ── Correo Electronico (SMTP) ─────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.debug=false
app.mail.from=${MAIL_FROM:}