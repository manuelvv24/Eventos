# ═══════════════════════════════════════════════════════════════════════════════
# Perfil PRODUCCIÓN — Railway
# ═══════════════════════════════════════════════════════════════════════════════

spring.application.name=eventos

# ── Base de datos ─────────────────────────────────────────────────────────────
# Railway inyecta variables sueltas de Postgres al vincular el servicio.
# El driver JDBC no soporta el formato user:pass@host de DATABASE_URL,
# por eso se arma la URL con host/puerto/db y se pasan credenciales aparte.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${POSTGRES_USER:${PGUSER:postgres}}
spring.datasource.password=${POSTGRES_PASSWORD:${PGPASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — ajustado para plan hobby Railway (max ~25 conexiones PG)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.validation-timeout=5000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Cloudinary ────────────────────────────────────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ── Certificados ──────────────────────────────────────────────────────────────
certificados.organizacion=${CERT_ORGANIZACION:Gestión de Eventos}
certificados.directorio-salida=/tmp/certificados
certificados.url-verificacion=${CERTIFICADOS_URL_VERIFICACION:${FRONTEND_URL:https://tu-frontend.up.railway.app}/verificar/codigo?codigo=}

# ── Correo Electrónico ────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@example.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.debug=false
app.mail.from=${MAIL_FROM:noreply@example.com}

# ── Upload ────────────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Thymeleaf ─────────────────────────────────────────────────────────────────
spring.thymeleaf.check-template-location=false

# ── Puerto ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Logging — más verboso para diagnosticar el arranque en Railway ────────────
logging.level.root=WARN
logging.level.Eventos.eventos=INFO
logging.level.org.springframework.boot.autoconfigure=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.deprecation=ERROR